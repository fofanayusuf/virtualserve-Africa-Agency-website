<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hire a Virtual Assistant | VirtualServe Africa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;margin:0;background:#f8fafc;color:#0f172a}
.container{max-width:700px;margin:auto;padding:80px 20px}
h1{text-align:center;font-size:2.4rem;margin-bottom:12px}
p{text-align:center;color:#64748b;margin-bottom:40px}
form{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:16px}
input,textarea{padding:14px;border-radius:12px;border:1px solid #e5e7eb;font-family:inherit}
button{padding:14px;border:none;border-radius:12px;background:#1f3cff;color:#fff;font-weight:600;cursor:pointer}
.back{text-align:center;margin-top:40px}
.back a{color:#1f3cff;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Hire a Virtual Assistant</h1>
<p>Tell us what you need and we’ll match you with the right assistant.</p>
<form action="https://formspree.io/f/xyzzabcd" method="POST">
<input type="text" name="name" placeholder="Full Name" required />
<input type="email" name="email" placeholder="Email Address" required />
<input type="text" name="company" placeholder="Company / Business" />
<textarea name="message" rows="4" placeholder="What tasks do you want to delegate?" required></textarea>
<button type="submit">Send Request</button>
</form>
<div class="back"><a href="index.html">← Back to Home</a></div>
</div>
</body>
</html>
