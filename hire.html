<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hire a Virtual Assistant | VirtualServe Africa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header>
    <div class="container nav">
      <div class="logo">VirtualServe Africa</div>

      <nav>
        <a href="/services.html">Services</a>
        <a href="/work.html">How it Works</a>
        <a href="/Team.html">Meet the Team</a>
        <a href="/Hire.html" class="btn">Hire a VA</a>
      </nav>

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <!-- ===== HIRE SECTION ===== -->
  <div class="container">
    <h1>Hire a Virtual Assistant</h1>
    <p>Tell us what you need and we’ll match you with the right assistant.</p>

    <form action="https://formspree.io/f/xyzzabcd" method="POST">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="text" name="company" placeholder="Company / Business" />
      <textarea name="message" rows="4" placeholder="What tasks do you want to delegate?" required></textarea>
      <button type="submit">Send Request</button>
    </form>

    <div class="back">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <!-- ===== HAMBURGER SCRIPT (if not already global) ===== -->
  <script>
    const hamburger = document.querySelector('.hamburger');
    const nav = document.querySelector('nav');

    if (hamburger && nav) {
      hamburger.addEventListener('click', () => {
        nav.classList.toggle('active');
        hamburger.classList.toggle('active');
      });
    }
  </script>

</body>
</html>
